/* Christmas theme: built from the Blossom V4 structure. No external images are used, so nothing can break:
   the backdrop is a Christmas street scene embedded in the script itself, plus light falling snow drawn with CSS gradients on the home screen. */

(() => {
  "use strict";
  if (document.getElementById("xmas-style")) return;

  const css = document.createElement("style");
  css.id = "xmas-style";
  css.textContent = `
    html:root {
      --xm-art: url("data:image/jpeg;base64,");
      --xm-art-dim: linear-gradient(rgb(5 10 8 / .5), rgb(5 10 8 / .5)), var(--xm-art);
      --xm-red: #d42a3c;
      --xm-red-dark: #7a1020;
      --xm-green: #1f7a3f;
      --xm-green-dark: #0b3d20;
      --xm-gold: #ffd86b;
      --xm-gold-light: #fff0b8;
      --xm-snow: #f5fbff;
      --xm-ink: #4a0d18;
      --xm-field: #14281c;
      --ss-yolk0: #ff6060;
      --ss-yolk: #048726;
      --ss-yolk2: var(--xm-gold);
      --ss-brown: #fff;
      --ss-blue00: #000;
      --ss-blue0: #9db8a5;
      --ss-blue1: #000;
      --ss-blue2: #000;
      --ss-blue3: #09b441;
      --ss-blue4: var(--xm-gold);
      --ss-blue5: #09b441;
      --ss-blue6: #12301f;
      --ss-blue7: var(--xm-gold);
      --ss-blue8: var(--xm-gold-light);
      --ss-green0: #09b441;
      --ss-green1: #4f7a5c;
      --ss-green2: #000;
      --ss-green-login: #a7c4af;
      --ss-twitch: transparent;
      --twitch-yellow: #fff;
      --twitch-lt-purple: transparent;
      --ss-blue2clear: rgb(0 0 0 / 0);
      --ss-blue2alpha7: rgb(255 216 107 / .7);
      --ss-blueblend1: linear-gradient(#000, #12301f);
      --ss-blueshadow: rgb(0 0 0 / .5);
      --ss-fieldbg: linear-gradient(var(--xm-field), var(--xm-field));
      --ss-text-shadow-1: .1em .1em 0 rgb(0 0 0 / .8);
      --ss-box-shadow-1: .16em .16em 0 #000;
      --ss-box-shadow-2: .15em .15em 0 rgb(0 0 0 / .9);
      --ss-lightoverlay: var(--xm-art);
      --ss-popupbackground: var(--xm-art-dim);
      --ss-scrollmask1: linear-gradient(transparent, transparent);
      --ss-scrollmask2: linear-gradient(transparent, transparent);
      --ss-white: #09b441;
      --ss-me-player-bg: rgb(200 35 55 / .85);
      --ss-red-btn-fill: #e0365f;
      --ss-red-btn-outline: #7a1530;
      --ss-vip-store-bg: linear-gradient(#000, #000);
      --ss-adblocker-text: #fff;
      --ss-big-message-border-color: var(--xm-gold);

      /* Shop colours, set to the values requested */
      --ss-premium-dark-green: #000000;
      --egg-pack-small-bg: linear-gradient(146deg, rgba(2, 0, 36, 1) 0%, rgb(217 4 4) 0%, rgb(20 42 213) 50%);
      --egg-pack-md-bg: linear-gradient(146deg, rgb(21 214 39) 0%, rgb(254 14 14) 0%, rgb(27 192 28) 50%);
      --egg-pack-lg-bg: linear-gradient(146deg, rgba(2, 0, 36, 1) 0%, rgb(19 238 46) 0%, rgb(239 105 1) 50%);
      --ss-premium-gradient: linear-gradient(to right bottom, #000000, #000000);
      --bundle-color: #000000;
      --bundle-text-color: #9aca10;
    }

    /* ---------- Home screen (with falling snow) ---------- */
    .load_screen {
      background-image:
        radial-gradient(circle, #fff 0 1.6px, transparent 2.2px),
        radial-gradient(circle, rgb(255 255 255 / .75) 0 1px, transparent 1.7px),
        var(--xm-art);
      background-size: 120px 120px, 80px 80px, cover;
      background-repeat: repeat, repeat, no-repeat;
      background-position: 0 0, 40px 60px, 50% 50%;
      animation: xm-snow 12s linear infinite;
    }
    @keyframes xm-snow {
      from { background-position: 0 0, 40px 60px, 50% 50%; }
      to { background-position: 0 120px, 40px 140px, 50% 50%; }
    }
    @media (prefers-reduced-motion: reduce) { .load_screen { animation: none; } }

    .main-menu-button:hover .main-nav-item-bg, .current-screen .main-nav-item-bg { fill: #ffffff00; stroke: #09b441; color: #09b441; }
    .main-menu-button.current-screen, .main-menu-button:hover { color: #fff; }
    .main-menu-button.current-screen .menu-icon, .main-menu-button:hover .menu-icon { fill: #fff; }
    .main-menu-button svg path:not(.main-nav-item-bg) { fill: #000 !important; }
    .ss_field, .firebaseui-input {
      background: var(--xm-field) !important; color: #09b441 !important; border-color: var(--xm-gold) !important;
      box-shadow: inset -.3em .3em .03em rgb(0 0 0 / .3), .2em .2em .01em #000 !important;
    }
    .ss_field::placeholder, .firebaseui-input::placeholder { color: #a9bfb0; }
    .ss_smtab.selected, .ss_smtab:hover { background: var(--xm-gold); }
    .btn_yolk { background: linear-gradient(#d42a3c, var(--xm-red-dark)); }
    .ss_bigtab.selected, .btn_toggleon { color: var(--xm-ink); }
    .bevel_yolk { box-shadow: var(--ss-box-shadow-1), var(--ss-btn-dark-bevel) var(--xm-gold), var(--ss-btn-light-bevel) #420000; }
    .icon-star { fill: #09b441; stroke: var(--xm-gold); }
    .player-challenges-container { background: var(--xm-art-dim) center / cover; }
    .text_yellow { color: #770606; }
    .text_yellow_bright { color: var(--xm-gold-light); }
    .text_blue { color: var(--xm-gold); }
    .regionPingWrap { background: rgb(0 0 0 / .45); }
    .greenPing { background-color: #8fe3b0; }
    .yellowPing { background-color: #ffe08a; }
    .orangePing { background-color: #ffb27a; }
    .redPing { background-color: #ff6b81; }
    .select-box-wrap { background: var(--xm-field); }

    /* ---------- Loading screen ---------- */
    /* The picture sits on the page itself, fixed to the whole window, and the loader panels are see-through,
       so no panel can cover the loading screen with a flat colour. */
    html:root { background: #1b130d var(--xm-art) 50% 50% / cover no-repeat fixed !important; }
    html, body { min-height: 100%; }
    body { background-color: transparent !important; }
    /* While loading, the loader covers the whole window with the street picture, so the home menu behind it
       (egg, tabs, buttons) is hidden until loading finishes. The game still hides the loader itself when done. */
    #progress-container {
      position: fixed !important; inset: 0 !important; width: 100% !important; height: 100% !important;
      background: #1b130d var(--xm-art) 50% 50% / cover no-repeat !important;
    }
    [id*="progress" i]:not(#progress-container, #progress-outer, #progress-outer *, #progressBar),
    [id*="loader" i]:not(input, button), [class*="loader" i]:not(input, button),
    [class*="spinner" i]:not(.spinner-tips, .spinner-tips *) { background-color: transparent !important; }
    #progress-container > div:not(#progress-outer) { background-color: transparent !important; }
    #progress-outer { background: var(--xm-red-dark) !important; }
    #progress-outer > div { background: #0d1f14 !important; }
    #progressBar { background: linear-gradient(90deg, var(--xm-red), var(--xm-gold)) !important; }
    .spinner-tips.tipMsg { background: #0d1f14; border: .15em solid var(--xm-gold); color: #09b441; }
    .spinner-tips.tipMsg::after { border-top-color: #0d1f14; }
    html .spinner-tips.LoadingMsgs p { color: #fff !important; text-shadow: var(--ss-text-shadow-1) !important; }
    .loading-progress-outer { background: var(--xm-red-dark); }
    .loading-progress { background: #0d1f14; }
    .loading-progress-bar { background: linear-gradient(90deg, var(--xm-red), var(--xm-gold)); }

    /* ---------- Requested extras ---------- */
    .text_blue3 { color: #189b07 !important; }
    .btn_toggleon { border-color: #026422 !important; color: #ffffff !important; background: #831313 !important; }
    .player-challenge-single-action-claimed {
      background: #000000; width: 35%; padding: .2em 0 .2em 1em; position: absolute; bottom: 0; right: 0; transform-origin: bottom left;
    }
    #vipEnded .bevel_red, .btn-dark-bevel.bevel_red {
      box-shadow: var(--ss-btn-dark-shadow), var(--ss-btn-dark-bevel) #3f0202b3, var(--ss-btn-light-bevel) #000000b5;
    }
    /* Scrollbars: black thumb on a red track. */
    html, body, * { scrollbar-color: #000000 #df0f0f; }
    /* Every text gets a thin black outline (inherited, so it reaches all text on the page). */
    html:root, body { -webkit-text-stroke: .06em #000; paint-order: stroke fill; }

    /* ---------- Stats ---------- */
    .stat-wrapper .stat:nth-child(odd) > div, .stat-wrapper .stat:nth-child(even) > div { background-color: transparent; }

    /* ---------- Inventory ---------- */
    .weapon_img { background-color: #000; border-color: #09b441; fill: #09b441; }
    #weapon_select .weapon_selected { background-color: #000; }
    .weapon_img:hover, #weapon_select .weapon_selected { border-color: var(--xm-gold); box-shadow: var(--ss-box-shadow-1); }
    .secondary .equip_icon, .primary .equip_icon { filter: none; }
    .ico_itemtype { border-color: var(--xm-gold); background: rgb(0 0 0 / .2); }
    .btn_green { background: radial-gradient(#4cb877, var(--xm-green), var(--xm-green-dark)); border-color: #000; color: #09b441; text-shadow: var(--ss-text-shadow-1); }
    .bevel_green { box-shadow: var(--ss-box-shadow-1), var(--ss-btn-dark-bevel) #8fe3b0, var(--ss-btn-light-bevel) #e7ffee; }
    .ss_bigtab { color: #09b441; border-color: #09b441; background: #000; box-shadow: var(--ss-box-shadow-1) !important; }
    #equip_grid .grid-item:not(.morestuff, .is-premium, .item-tag-limited, .item-tag-vipitem) { background: #000; border-color: #09b441; }
    #equip_grid .highlight { color: var(--xm-ink); }
    #stamp-controls .button .arrow { fill: var(--xm-ink); }

    /* ---------- Shop ---------- */
    #bundlePopup { background-image: var(--xm-art-dim); }
    .single-egg-store-item.single-egg-store-item-is-bundle { background-image: linear-gradient(#b3243a, var(--xm-red-dark)); }
    .eggshop_pricebox.slashed { color: rgb(255 255 255 / .6); }
    /* VIP club: the rainbow backdrop is shifted toward Christmas colours instead of being replaced. */
    .vip-club-background { filter: hue-rotate(-70deg) saturate(.9) brightness(.8); }
    .vip-club { color: #fff; }
    .vip-club-log-content--outer { background: rgb(0 0 0 / .7); border: .15em solid var(--xm-gold); color: #09b441; }
    .vip-club-log-content--outer li, .vip-club-log-content--outer span:not([class*="text_"]) { color: #fff; }
    .vip-club-log-content--outer .text_darkgreen { color: #5fd36a; }

    /* ---------- Popups, buttons and text colours ---------- */
    .popup_window, .play-panel-panels, #tutorialPopup { background-size: cover; background-position: center; border-color: #09b441; }
    #tutorialPopup { background-image: var(--xm-art-dim); }
    /* Any popup that uses the shared popup picture (weapon change, notifications, private games...) must scale it
       to fit its own box, instead of showing it at full size and cropping a tiny corner. */
    :is([class*="popup_"], [id$="Popup"], [id$="popup"]):not([class*="popup_title"]) {
      background-size: cover !important; background-position: 50% 50% !important; background-repeat: no-repeat !important;
    }
    .tutorial-labels span { z-index: 1; }
    .tutorial-labels span:not(.tutorial-special-keys) { color: var(--xm-gold-light); }
    .tutorial-labels .tutorial-special-keys { color: var(--xm-ink) !important; text-shadow: none; }
    .tutorial-keyboard, .tutorial-mouse { filter: hue-rotate(-20deg) saturate(.85); }
    #adBlockerVideo { background: var(--xm-art-dim) center / cover; border: .2em solid #09b441; }
    .box_blue4 { background-color: rgb(0 0 0 / .6); }
    .ss_button_join { background: linear-gradient(#d42a3c, var(--xm-red-dark)); color: #09b441; box-shadow: .1em .1em 3px #000; }
    .bevel_blue { box-shadow: var(--ss-box-shadow-1), var(--ss-btn-dark-bevel) #000, var(--ss-btn-light-bevel) #09b441; }
    .btn_blue { background-color: var(--xm-gold); border-color: #09b441; }
    .bevel_blue_light { box-shadow: var(--ss-box-shadow-1), var(--ss-btn-dark-bevel) #5f7a68, var(--ss-btn-light-bevel) #5f7a68; }
    /* Light gold surfaces get dark red text so they stay readable. */
    .btn_blue, .btn_blue_light, .tool-tip--bubble { color: var(--xm-ink); }
    .btn_blue, .btn_blue_light { text-shadow: none; }
    .text_blue1, .text_blue8 { color: #fff !important; }
    .btn_blue.text_blue1 { color: var(--xm-ink) !important; }
    .text_blue4 { color: #a9bfb0 !important; }
    .bg_blue2 { background-color: transparent; }
    .bg_blue3 { background-color: transparent !important; }
    .bg_blue6 { background-color: rgb(0 0 0 / .7) !important; }
    .option-box { border-color: #09b441; box-shadow: .26em .26em 0 rgb(0 0 0 / .5); }
    .option-box li:hover { background: rgb(241 241 241 / .5); }
    .changelog_content { color: #fff; background: transparent; }
    #feedback_panel p, #feedback_panel li, .load_message { color: #fff; }

    /* ---------- Egg coin icon becomes a candy cane ---------- */
    /* The currency icon is matched by name (golden egg / egg coin images and classes). */
    img[src*="goldenegg" i], img[src*="eggcoin" i], img[src*="egg_coin" i] { content: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='11%203%2046%2064'%3E%3Cpath%20d='M22%2058V26a12%2012%200%200%201%2024%200v4'%20fill='none'%20stroke='%23000'%20stroke-width='15'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Cpath%20d='M22%2058V26a12%2012%200%200%201%2024%200v4'%20fill='none'%20stroke='%23fff'%20stroke-width='11'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Cpath%20d='M22%2056V26a12%2012%200%200%201%2024%200v3'%20fill='none'%20stroke='%23d42a3c'%20stroke-width='11'%20stroke-dasharray='5%208'%20stroke-dashoffset='-2'/%3E%3C/svg%3E"); object-fit: contain; }
    [class*="egg-coin" i], [class*="eggcoin" i], [class*="golden-egg" i] {
      background: url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='11%203%2046%2064'%3E%3Cpath%20d='M22%2058V26a12%2012%200%200%201%2024%200v4'%20fill='none'%20stroke='%23000'%20stroke-width='15'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Cpath%20d='M22%2058V26a12%2012%200%200%201%2024%200v4'%20fill='none'%20stroke='%23fff'%20stroke-width='11'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Cpath%20d='M22%2056V26a12%2012%200%200%201%2024%200v3'%20fill='none'%20stroke='%23d42a3c'%20stroke-width='11'%20stroke-dasharray='5%208'%20stroke-dashoffset='-2'/%3E%3C/svg%3E") center / contain no-repeat !important;
    }

    /* Black outline around the candy cane and the egg count next to it. */
    img[src*="goldenegg" i], img[src*="eggcoin" i], img[src*="egg_coin" i],
    [class*="egg-coin" i], [class*="eggcoin" i], [class*="golden-egg" i] {
      filter: drop-shadow(.06em 0 0 #000) drop-shadow(-.06em 0 0 #000) drop-shadow(0 .06em 0 #000) drop-shadow(0 -.06em 0 #000);
      transform: scale(1.3); transform-origin: center;
    }
    :is([class*="egg-count" i], [class*="eggcount" i], [class*="egg-balance" i], [class*="eggbalance" i],
        [id*="egg-count" i], [id*="eggcount" i], [id*="eggbalance" i], [class*="currency" i]) {
      -webkit-text-stroke: .14em #000; paint-order: stroke fill;
      text-shadow: .08em .08em 0 #000;
    }

    /* ---------- Settings ---------- */
    .ss_keybind { color: #fff; background: transparent; }
    .label { color: rgb(255 255 255 / .85); }
    .checkmark { background-color: rgb(0 0 0 / .3); box-shadow: inset 0 0 0 .15em rgb(255 255 255 / .75); }
    .ss_checkbox .checkmark:after { border-color: #09b441; }
    .ss_select { background: transparent; color: #fff; }
    .ss_select option { background: #0d1f14; color: #fff; }
    #joinPrivateGamePopup .inner-wrapper { background-color: transparent; }

    /* ---------- Pause menu and chat ---------- */
    .playerSlot--name { color: var(--xm-gold) !important; }
    /* Leaderboard: your own row is red, the other rows are green. Names stay gold and scores white so they read on both.
       Written without !important so the game's team colours still win in team modes. */
    .playerSlot { background-color: rgb(20 100 50 / .8); }
    .playerSlot--score { color: #fff; }
    .pause-screen-btn-spectate { box-shadow: .15em .15em 0 rgb(0 0 0 / .3), var(--ss-btn-dark-bevel) #000, var(--ss-btn-light-bevel) #000 !important; }
    .btn-respawn.bevel_green { box-shadow: .15em .15em 0 rgb(0 0 0 / .3), var(--ss-btn-dark-bevel) #1fae52, var(--ss-btn-light-bevel) #1fae52; }
    .is-paused .pause-ui-element { background-color: rgb(20 80 45 / .55); border: var(--ss-common-border-width) solid #09b441; }
    .chat { color: #fff; opacity: .7; }
    #chatIn { color: #ff0000; }
    .chat-player-name { color: var(--xm-gold); }
    .chat-pinned-item { color: var(--xm-gold-light); }
    .is-paused .chat-item:first-child.chat-pinned-item { color: #fff; background-color: var(--xm-red-dark); }

    /* ---------- In-game HUD ---------- */
    #inGameUI { background-color: transparent; border-color: var(--xm-gold); }
    #inGameUI .title { color: var(--xm-gold); }
    .crosshair { border: solid .05em #1fae52; opacity: 1; }
    .crosshair.normal { background: #e0243a; opacity: 1; }
    #reticleDot { background: #e0243a; border-color: #1fae52; }
    /* Health: green ring, red yolk, white number so it reads on both. */
    #healthContainer { background: #1fae52; opacity: .75; --ss-white: #fff; }
    #healthContainer :is(span, div, p, h1, h2, h3) { color: #fff; }
    #healthContainer text { fill: #fff; }
    .healthYolk { fill: #e0243a; }
    .healthBar-hardBoiled { stroke: #1fae52; }
    #bigMessageCaption { color: var(--xm-gold); }
    .egg-breaker-icon { fill: var(--xm-gold); }
    .egg-breaker-msg { color: var(--xm-gold); }
    #egg-breaker-icon-wrap .centered, .egg-breaker-timer { color: var(--xm-ink); }

    /* ---------- Christmas sniper scope ---------- */
    /* Dark vignette outside a round lens, red crosshair with a green outline, and a red-and-white candy-cane ring.
       The game's own scope element is matched by name; it keeps showing and hiding itself as before. */
    :is([id*="scope" i], [class*="scope" i]):not(input, button, label) {
      background:
        radial-gradient(circle at 50% 50%, #e0243a 0 .4vmin, #1fae52 .4vmin .7vmin, transparent .75vmin),
        linear-gradient(#e0243a, #e0243a) 50% 50% / .18vmin 90vmin no-repeat,
        linear-gradient(#e0243a, #e0243a) 50% 50% / 90vmin .18vmin no-repeat,
        linear-gradient(#1fae52, #1fae52) 50% 50% / .42vmin 90vmin no-repeat,
        linear-gradient(#1fae52, #1fae52) 50% 50% / 90vmin .42vmin no-repeat,
        radial-gradient(circle at 50% 50%, transparent 0 44vmin, rgb(8 20 12 / .96) 44.4vmin) !important;
      border: 0 !important;
    }
